name: Render actual native home and system tabs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 and an available iOS 26 iPhone
        run: |
          python3 -u - <<'PY'
          import pathlib, subprocess, json, os
          paths=sorted(pathlib.Path('/Applications').glob('Xcode_26*.app'),reverse=True)
          assert paths, 'Xcode 26 required'
          subprocess.run(['sudo','xcode-select','-s',str(paths[0]/'Contents/Developer')],check=True)
          version=subprocess.check_output(['xcodebuild','-version'],text=True)
          print(version)
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          candidates=[(r,d) for r,ds in data.items() if '.iOS-26' in r for d in ds if d['name'].startswith('iPhone')]
          assert candidates, 'An actual iOS 26 simulator is required'
          candidates.sort(key=lambda x: ('Pro' not in x[1]['name'], 'Max' in x[1]['name'], x[1]['name']))
          runtime,device=candidates[0]
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+device['udid']+'\n')
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/simulator.json').write_text(json.dumps(dict(runtime=runtime,device=device,xcode=version),indent=2))
          PY
      - name: Build offline SwiftUI sample
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          xcodebuild build -project LiquidStudies.xcodeproj -scheme LiquidStudies -configuration Debug -destination "generic/platform=iOS Simulator" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO > build/compile.log 2>&1 || { tail -100 build/compile.log; exit 1; }
      - name: Boot simulator and capture native home
        run: |
          python3 -u - <<'PY'
          import subprocess,os,pathlib,time
          simulator=os.environ['SIMULATOR_ID']
          def run(*args,timeout=60,check=True):
              print('COMMAND:',*args,flush=True)
              return subprocess.run(args,timeout=timeout,check=check)
          run('xcrun','simctl','boot',simulator,timeout=180,check=False)
          run('xcrun','simctl','bootstatus',simulator,'-b',timeout=240)
          run('xcrun','simctl','ui',simulator,'appearance','light')
          run('xcrun','simctl','status_bar',simulator,'override','--time','9:41','--dataNetwork','wifi','--wifiMode','active','--wifiBars','3','--batteryState','charged','--batteryLevel','100')
          run('xcrun','simctl','install',simulator,'build/DerivedData/Build/Products/Debug-iphonesimulator/LiquidStudies.app',timeout=90)
          run('xcrun','simctl','launch',simulator,'com.wuyou28.liquidstudies','-AppleLanguages','(zh-Hans)','-AppleLocale','zh_CN',timeout=90)
          pathlib.Path('build/screenshots').mkdir(exist_ok=True)
          time.sleep(8)
          run('xcrun','simctl','io',simulator,'screenshot','build/screenshots/native-home.png')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-liquid-glass-studies
          path: |
            build/screenshots
            build/compile.log
            build/simulator.json
          if-no-files-found: error
