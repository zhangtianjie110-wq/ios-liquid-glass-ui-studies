name: Render native white Liquid Glass studies
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 and iOS 26 iPhone
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, json, os
          paths=sorted(pathlib.Path('/Applications').glob('Xcode_26*.app'),reverse=True)
          if paths:
              subprocess.run(['sudo','xcode-select','-s',str(paths[0]/'Contents/Developer')],check=True)
          print(subprocess.check_output(['xcodebuild','-version'],text=True))
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          candidates=[(r,d) for r,ds in data.items() if '.iOS-26' in r for d in ds if d['name'].startswith('iPhone')]
          assert candidates, 'Actual iOS 26 simulator required; no browser approximation permitted'
          candidates.sort(key=lambda x: ('Pro' not in x[1]['name'], 'Max' in x[1]['name'], x[1]['name']))
          runtime,device=candidates[0]
          types=json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))['devicetypes']
          kind=next(t['identifier'] for t in types if t['name']==device['name'])
          fresh=subprocess.check_output(['xcrun','simctl','create','UI-Studies-Fresh',kind,runtime],text=True,timeout=60).strip()
          device=dict(device,udid=fresh)
          subprocess.run(['open','-a','Simulator'],timeout=30,check=False)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+device['udid']+'\n')
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/simulator.json').write_text(json.dumps(dict(runtime=runtime,device=device),indent=2))
          PY
      - name: Generate and build isolated offline design app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project LiquidStudies.xcodeproj -scheme LiquidStudies -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO > build/compile.log 2>&1 || { tail -100 build/compile.log; exit 1; }
      - name: Capture five redesigned native iOS screenshots
        run: |
          python3 -u - <<'PY'
          import subprocess,os,pathlib,time,json
          simulator=os.environ['SIMULATOR_ID']
          def run(*args,timeout=60,check=True):
              print('COMMAND:',*args,flush=True)
              return subprocess.run(args,timeout=timeout,check=check)
          run('xcrun','simctl','boot',simulator,timeout=120)
          run('xcrun','simctl','bootstatus',simulator,'-b',timeout=360)
          run('xcrun','simctl','ui',simulator,'appearance','light')
          run('xcrun','simctl','status_bar',simulator,'override','--time','9:41','--dataNetwork','wifi','--wifiMode','active','--wifiBars','3','--batteryState','charged','--batteryLevel','100')
          run('xcrun','simctl','install',simulator,'build/DerivedData/Build/Products/Debug-iphonesimulator/LiquidStudies.app',timeout=90)
          pathlib.Path('build/screenshots').mkdir(exist_ok=True)
          for study in range(5):
              run('xcrun','simctl','terminate',simulator,'com.wuyou28.liquidstudies',check=False)
              run('xcrun','simctl','launch',simulator,'com.wuyou28.liquidstudies','-study',str(study),'-AppleLanguages','(zh-Hans)','-AppleLocale','zh_CN',timeout=90)
              time.sleep(6)
              run('xcrun','simctl','io',simulator,'screenshot',f'build/screenshots/study-{study}.png')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-liquid-glass-studies
          path: |
            build/screenshots
            build/compile.log
            build/simulator.json
          if-no-files-found: error
